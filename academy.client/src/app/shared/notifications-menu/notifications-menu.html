<div class="relative" [class]="open() ? 'relative z-[20000]' : 'relative'">
  <button
    type="button"
    class="relative flex size-9 items-center justify-center rounded-lg text-ink transition hover:bg-body"
    (click)="toggle($event)"
    [attr.aria-expanded]="open()"
  >
    <svg class="size-5" viewBox="0 0 24 24" fill="none">
      <path d="M12 3a5 5 0 0 0-5 5v2.2c0 .7-.2 1.4-.6 2L5.2 14.5A1.2 1.2 0 0 0 6.2 16.4h11.6a1.2 1.2 0 0 0 1-1.9l-1.2-2.3c-.4-.6-.6-1.3-.6-2V8a5 5 0 0 0-5-5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
      <path d="M10 18.5a2 2 0 0 0 4 0" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    </svg>
    @if (unreadCount() > 0) {
      <span class="absolute -end-1 -top-1 grid min-w-5 place-items-center rounded-full bg-primary-500 px-1 text-[10px] font-bold text-white">
        {{ unreadCount() }}
      </span>
    }
  </button>

  <div
    class="absolute end-0 top-[calc(100%+0.55rem)] w-[min(380px,88vw)] overflow-hidden rounded-2xl border border-line bg-surface shadow-dropdown transition duration-200"
    [class]="open() ? 'pointer-events-auto translate-y-0 scale-100 opacity-100' : 'pointer-events-none translate-y-2 scale-95 opacity-0'"
    [attr.aria-hidden]="!open()"
  >
    <div class="flex items-start justify-between gap-3 border-b border-line px-4 py-3">
      <div>
        <p class="text-sm font-bold text-ink">{{ 'common.notifications' | t }}</p>
        <p class="text-xs text-muted">{{ unreadCount() }}</p>
      </div>
      <button type="button" class="text-xs font-bold text-primary-600 hover:text-primary-700" (click)="markAll($event)">
        {{ 'common.markAllRead' | t }}
      </button>
    </div>

    <div class="max-h-80 overflow-auto p-2">
      @if (items().length === 0) {
        <p class="px-3 py-8 text-center text-sm text-muted">{{ 'common.noNotifications' | t }}</p>
      } @else {
        @for (item of items(); track item.id) {
          <button
            type="button"
            class="grid w-full grid-cols-[8px_1fr_auto] gap-3 rounded-xl px-3 py-3 text-start transition hover:bg-body"
            [class.bg-primary-50]="!item.read"
            (click)="openItem(item, $event)"
          >
            <span class="mt-1.5 size-2 rounded-full" [class.bg-primary-500]="!item.read"></span>
            <span class="min-w-0">
              <strong class="block text-sm font-semibold text-ink">{{ item.title }}</strong>
              <small class="mt-0.5 block text-xs leading-relaxed text-muted">{{ item.body }}</small>
            </span>
            <time class="whitespace-nowrap text-[11px] text-muted">{{ item.time }}</time>
          </button>
        }
      }
    </div>
  </div>
</div>
