<div class="relative" [class]="open() ? 'relative z-[20000]' : 'relative'">
  <button
    type="button"
    class="flex items-center gap-2.5 rounded-lg py-1 pe-1.5 ps-1 transition hover:bg-body"
    (click)="toggle($event)"
    [attr.aria-expanded]="open()"
  >
    <span class="hidden min-w-0 text-end sm:block">
      <strong class="block max-w-[9.5rem] truncate text-[13px] font-bold text-ink">{{ fullName() }}</strong>
    </span>
    <app-user-avatar [src]="photoUrl()" [alt]="fullName()" size="md" />
  </button>

  <div
    class="absolute end-0 top-[calc(100%+0.55rem)] w-60 rounded-xl border border-line bg-surface p-2 shadow-dropdown transition duration-200"
    [class]="open() ? 'pointer-events-auto translate-y-0 scale-100 opacity-100' : 'pointer-events-none translate-y-2 scale-95 opacity-0'"
    [attr.aria-hidden]="!open()"
  >
    <div class="mb-2 flex items-center gap-3 border-b border-line px-2 pb-3 pt-1">
      <app-user-avatar [src]="photoUrl()" [alt]="fullName()" size="md" />
      <div class="min-w-0">
        <strong class="block truncate text-sm text-ink">{{ fullName() }}</strong>
        <small class="block truncate text-xs text-muted">{{ email() }}</small>
      </div>
    </div>

    <a
      routerLink="profile"
      class="block rounded-lg px-3 py-2.5 text-sm font-semibold text-ink transition hover:bg-body"
      (click)="open.set(false)"
    >
      {{ 'common.profile' | t }}
    </a>
    <button
      type="button"
      class="block w-full rounded-lg px-3 py-2.5 text-start text-sm font-semibold text-danger transition hover:bg-rose-50"
      (click)="logout($event)"
    >
      {{ 'common.logout' | t }}
    </button>
  </div>
</div>
